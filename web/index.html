<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成大智慧通勤</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #f7f3ee;
    --surface: #fffdfa;
    --border: #dfd3c9;
    --text: #2d2522;
    --muted: #746963;
    --accent: #7c1f2a;
    --accent-soft: #f3e4e6;
    --now: #a85b20;
    --grid-line: #eee5de;
    --slot-h: 1.05px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #21191a;
      --surface: #2c2122;
      --border: #4a3838;
      --text: #f3e9e5;
      --muted: #c7b6b0;
      --accent: #e3a6ae;
      --accent-soft: #512b30;
      --now: #edb476;
      --grid-line: #3b2d2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 16px 64px; }
  header { margin-bottom: 24px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.875rem; margin: 0; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; margin-bottom: 24px;
  }
  .label {
    font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 8px;
  }
  .course-name { font-size: 1.375rem; font-weight: 650; margin: 0 0 12px; }
  .rows { display: grid; gap: 8px; margin-bottom: 18px; }
  .row { display: grid; grid-template-columns: 5.5rem 1fr; gap: 12px; font-size: 0.9375rem; }
  .row dt { color: var(--muted); }
  .row dd { margin: 0; }
  .countdown { color: var(--accent); font-weight: 600; }
  .badge {
    display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); margin-left: 6px;
    vertical-align: 2px;
  }
  .btn {
    display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
    padding: 10px 18px; border-radius: 9px; font-weight: 600; font-size: 0.9375rem;
  }
  .btn:hover { filter: brightness(1.08); }
  .note { font-size: 0.8125rem; color: var(--muted); margin: 10px 0 0; }

  /* 教室平面圖 */
  .plan { margin-top: 12px; }
  .plan img {
    width: 100%; border-radius: 10px; border: 1px solid var(--line);
    background: #fff; display: block;
  }
  .plan figcaption { font-size: 0.8125rem; color: var(--muted); margin-top: 6px; }
  .plan-wrap { position: relative; line-height: 0; }
  .plan-mark {
    position: absolute; border: 3px solid var(--now); border-radius: 4px;
    pointer-events: none;
  }
  .plan-mark span {
    position: absolute; left: 50%; top: -9px; transform: translate(-50%, -100%);
    background: var(--now); color: #fff; font-size: 0.75rem; line-height: 1.4;
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  }
  .plan-tabs { display: flex; gap: 8px; margin-top: 12px; }
  .plan-tabs button {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    border-radius: 999px; padding: 5px 14px; font-size: 0.8125rem; cursor: pointer;
  }
  .plan-tabs button.on { background: var(--accent-soft); color: var(--accent);
    border-color: transparent; font-weight: 600; }
  .floor-big { font-size: 1.5rem; font-weight: 700; margin: 4px 0 0; }

  /* 停車場走到大樓 */
  .walk { margin-top: 12px; position: relative; line-height: 0; }
  .walk img { width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }
  .walk svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .walk .pin {
    position: absolute; transform: translate(-50%, -50%); font-size: 0.75rem;
    line-height: 1.4; padding: 2px 8px; border-radius: 999px; color: #fff;
    white-space: nowrap; font-weight: 600;
  }
  .walk .pin.start { background: #1f2937; }
  .walk .pin.end { background: var(--now); }
  .steps { margin: 12px 0 0; padding-left: 1.25rem; }
  .steps li { font-size: 0.875rem; margin-bottom: 4px; }

  /* 週課表 */
  .grid-head, .grid-body { display: grid; grid-template-columns: 3.25rem repeat(7, 1fr); }
  .grid-head div {
    text-align: center; font-size: 0.8125rem; color: var(--muted);
    padding-bottom: 8px; font-weight: 600;
  }
  .grid-body { position: relative; }
  .axis { position: relative; }
  .axis span {
    position: absolute; right: 8px; transform: translateY(-50%);
    font-size: 0.6875rem; color: var(--muted);
  }
  .col { position: relative; border-left: 1px solid var(--grid-line); }
  .hour { position: absolute; left: 0; right: 0; border-top: 1px solid var(--grid-line); }
  .block {
    position: absolute; left: 3px; right: 3px; border-radius: 7px;
    background: var(--accent-soft); border-left: 3px solid var(--accent);
    padding: 5px 7px; overflow: hidden; font-size: 0.75rem;
  }
  .block b { display: block; font-weight: 600; font-size: 0.8125rem; }
  .block small { color: var(--muted); }
  .block.is-next { outline: 2px solid var(--accent); }
  .block.is-current { background: var(--accent); border-left-color: var(--accent); }
  .block.is-current b, .block.is-current small { color: #fff; }
  .nowline { position: absolute; left: 0; right: 0; border-top: 2px solid var(--now); z-index: 3; }
  .nowline::before {
    content: ""; position: absolute; left: -4px; top: -5px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--now);
  }
  .err { color: #b91c1c; }

  /* 交通模式選單 */
  .modes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .modes button {
    font: inherit; font-size: 0.875rem; cursor: pointer;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px; padding: 7px 16px;
  }
  .modes button:hover { border-color: var(--accent); }
  .modes button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }
  .veh { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .veh span { font-size: 0.8125rem; color: var(--muted); }

  /* 停車場 */
  .lot { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
         padding: 10px 0; border-top: 1px solid var(--border); font-size: 0.9375rem; }
  .lot:first-of-type { border-top: 0; }
  .lot .meta { color: var(--muted); font-size: 0.8125rem; }
  .lot .free { font-weight: 650; color: var(--accent); text-align: right; }
  .lot.pick { background: var(--accent-soft); border-radius: 8px; padding: 12px; border-top: 0; }
  .lot.pickable { width: 100%; font: inherit; color: inherit; text-align: left;
                  background: none; border-left: 0; border-right: 0; border-bottom: 0;
                  cursor: pointer; align-items: center; }
  .lot.pickable:hover { background: var(--accent-soft); }
  .lot.pickable.picked { background: var(--accent-soft);
                         outline: 2px solid var(--accent); border-radius: 8px; }
  .skipped { font-size: 0.8125rem; color: var(--muted); margin-top: 12px; }
  .spinner { color: var(--muted); font-size: 0.875rem; }

  /* 路況事件 */
  .event-side + .event-side { margin-top: 16px; }
  .event { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px;
           padding: 8px 0; border-top: 1px solid var(--border); font-size: 0.9375rem; }
  .event:first-of-type { border-top: 0; }
  .event .dist { font-weight: 650; color: var(--now); white-space: nowrap; }
  .event .meta { color: var(--muted); font-size: 0.8125rem; }
  .event-clear { color: var(--accent); font-size: 0.9375rem; }

  /* 出發地 */
  .origin { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .origin label { font-size: 0.8125rem; color: var(--muted); }
  .origin input {
    flex: 1 1 240px; font: inherit; font-size: 0.9375rem; padding: 8px 12px;
    border: 1px solid var(--border); border-radius: 9px;
    background: var(--surface); color: var(--text);
  }
  .origin input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .origin button {
    font: inherit; font-size: 0.875rem; cursor: pointer; padding: 8px 16px;
    border: 1px solid var(--border); border-radius: 9px;
    background: var(--surface); color: var(--text);
  }
  .origin button[type="submit"] {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }
  .trip {
    display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline;
    padding: 12px; border-radius: 9px; background: var(--accent-soft); margin-bottom: 16px;
  }
  .trip b { font-size: 1.125rem; color: var(--accent); }
  .trip.urgent { background: #fff4e5; border-left: 3px solid var(--now); }
  .trip.urgent b { color: var(--now); }
  .trip.late { background: #fde8e8; border-left: 3px solid #b91c1c; }
  .trip.late b { color: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .trip.urgent { background: #3a2a14; }
    :root:not([data-theme="light"]) .trip.late { background: #3a1c1c; }
  }
  .note.warn { color: var(--now); }
  .advice-pick { font-size: 1.25rem; font-weight: 650; margin: 0 0 6px; }
  .advice-why { margin: 0 0 12px; font-size: 0.9375rem; }
  .src { display: inline-block; font-size: 0.75rem; padding: 2px 8px;
         border-radius: 999px; background: var(--accent-soft); color: var(--accent);
         margin-left: 8px; vertical-align: 3px; }
  .src.rules { background: #fff4e5; color: var(--now); }
  .cmp { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px;
         padding: 8px 0; border-top: 1px solid var(--border); font-size: 0.875rem; }
  .cmp.win { font-weight: 650; }
  .cmp .meta { color: var(--muted); font-size: 0.8125rem; }
  .trip span { font-size: 0.875rem; color: var(--muted); }

  /* 上課提醒橫幅：時間到才出現，用警示色跟一般卡片區隔開 */
  .banner { display: none; background: var(--now); color: #fff;
            border-radius: 14px; padding: 18px 20px; margin-bottom: 24px; }
  .banner.on { display: block; }
  .banner .label { color: rgba(255, 255, 255, 0.82); }
  .banner h2 { margin: 0 0 6px; font-size: 1.25rem; font-weight: 650; }
  .banner p { margin: 0 0 4px; font-size: 0.9375rem; }
  .banner .btn { background: #fff; color: var(--now); margin-top: 12px; }

  /* 上傳課表 */
  .upload { text-align: center; padding: 26px 20px;
            border: 1px dashed var(--border); border-radius: 12px; }
  .upload.drag { border-color: var(--accent); background: var(--accent-soft); }
  .upload h2 { margin: 0 0 6px; font-size: 1.125rem; }
  .upload p { margin: 0 0 16px; color: var(--muted); font-size: 0.875rem; }
  #fileInput { display: none; }
  .filebtn { display: inline-block; cursor: pointer; background: var(--accent);
             color: #fff; padding: 10px 20px; border-radius: 9px;
             font-weight: 600; font-size: 0.9375rem; }
  .filebtn:hover { filter: brightness(1.08); }
  .ghost { font: inherit; font-size: 0.875rem; cursor: pointer; padding: 8px 15px;
           border: 1px solid var(--border); border-radius: 9px;
           background: var(--surface); color: var(--text); }
  .ghost:hover { border-color: var(--accent); }
  .srcline { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
             font-size: 0.8125rem; color: var(--muted); }
  .srcline .grow { flex: 1 1 auto; }
  .warn { color: #b45309; font-size: 0.8125rem; margin: 10px 0 0; }

  /* 展示控制：demo 時用來把時間挪到上課前，查的仍是真實 API */
  .demobar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
             font-size: 0.8125rem; color: var(--muted); }
  .demobar input[type="datetime-local"], .demobar select {
    font: inherit; font-size: 0.875rem; padding: 6px 10px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text);
  }
  .simbadge { background: var(--now); color: #fff; padding: 2px 9px;
              border-radius: 999px; font-size: 0.75rem; font-weight: 600; }

  /* 有些元素自己設了 display（例如 flex），會蓋掉瀏覽器內建的 [hidden]，統一補上 */
  [hidden] { display: none !important; }

  /* 模擬情境與自動調整 */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { font: inherit; font-size: 0.8125rem; cursor: pointer; padding: 6px 14px;
          border-radius: 999px; border: 1px solid var(--border);
          background: var(--surface); color: var(--text); }
  .chip:hover { border-color: var(--now); }
  .chip[aria-pressed="true"] { background: var(--now); border-color: var(--now);
                               color: #fff; font-weight: 600; }
  .chip.clear { border-style: dashed; color: var(--muted); }
  .autobar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
             margin: -6px 0 16px; font-size: 0.875rem; }
  .autobar label { cursor: pointer; font-weight: 600; }
  .autobar input { accent-color: var(--accent); margin-right: 6px; }
  .adj { display: grid; grid-template-columns: 3.25rem 1fr; gap: 10px; padding: 10px 0;
         border-top: 1px solid var(--border); font-size: 0.9375rem; }
  .adj-time { color: var(--muted); font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
  .adj.switch { border-left: 3px solid var(--accent); padding-left: 10px; }
  .adj.warn { border-left: 3px solid #b91c1c; padding-left: 10px; }
  .adj .meta { color: var(--muted); font-size: 0.8125rem; }
  .linkbtn { display: inline-block; text-decoration: none; margin-left: 8px; }

  /* 遲到通知信草稿、拍門牌 */
  .draft label { display: block; font-size: 0.8125rem; color: var(--muted); margin: 12px 0 4px; }
  .draft input, .draft textarea { width: 100%; font: inherit; font-size: 0.9375rem;
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 9px;
    background: var(--surface); color: var(--text); }
  .draft textarea { min-height: 11rem; line-height: 1.6; }
  .scan { margin-top: 16px; }

  @media (max-width: 640px) {
    .wrap { padding: 20px 16px 48px; }
    .block b { font-size: 0.6875rem; }
    .block small { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>成大智慧通勤</h1>
    <p class="sub" id="clock">載入中…</p>
  </header>

  <div class="banner" id="banner"></div>

  <section class="card" id="routeUpdate" hidden>
    <p class="label">路線更新</p>
    <div id="routeUpdateContent"></div>
  </section>

  <section class="card" id="uploadCard"></section>

  <section class="card" id="demoCard" hidden>
    <p class="label">展示控制</p>
    <div class="demobar">
      <label for="leadSelect">上課前提醒</label>
      <select id="leadSelect">
        <option value="5">5 分鐘</option>
        <option value="15">15 分鐘</option>
        <option value="30" selected>30 分鐘</option>
        <option value="60">1 小時</option>
        <option value="180">3 小時</option>
        <option value="1440">1 天</option>
      </select>
      <label for="simTime">模擬時間</label>
      <input type="datetime-local" id="simTime">
      <button type="button" class="ghost" id="jumpLead">跳到提醒觸發時刻</button>
      <button type="button" class="ghost" id="jump20">跳到上課前 20 分</button>
      <button type="button" class="ghost" id="backToNow">回到現在</button>
      <button type="button" class="ghost" id="askNotify">開啟桌面通知</button>
      <button type="button" class="ghost" id="pushPhone">推播到手機</button>
    </div>
    <p><button type="button" class="ghost" id="demoRouteUpdate">模擬路線增加 5 分鐘</button></p>
    <div id="scenarioBox" hidden>
      <div class="chips" id="scenarioChips"></div>
      <p class="note" id="scenarioNote"></p>
    </div>
    <p class="note" id="demoNote">模擬時間只是換一個時間點去問同一套系統，
      教室、車位查的仍然是真實 API。</p>
  </section>

  <form class="origin" id="originForm">
    <label for="originInput">出發地</label>
    <input id="originInput" type="text" placeholder="例如：成大圖書館、雲平大樓" autocomplete="off">
    <button type="submit">更新</button>
    <button type="button" id="resetOrigin">用預設</button>
  </form>

  <form class="origin" id="prefForm">
    <label for="prefInput">通勤偏好</label>
    <input id="prefInput" type="text" maxlength="300" autocomplete="off"
           placeholder="例如：我怕熱，不想在太陽下走超過 15 分鐘">
    <button type="submit">儲存並重新詢問</button>
  </form>

  <div class="modes" id="modes"></div>

  <div class="autobar" id="autoBar" hidden>
    <label><input type="checkbox" id="autoMode">自動調整交通方式</label>
    <span class="note" id="autoHint">環境變了（下雨、沒車、來不及），會自己換並記下原因</span>
  </div>

  <section class="card" id="adjust" hidden></section>

  <section class="card" id="advice">
    <p class="label">AI 建議</p>
    <p class="spinner" id="adviceIdle">正在比較四種交通方式並請 Gemini 判斷…（約 15 秒）</p>
  </section>

  <section class="card" id="hero"><p class="sub">查詢中…</p></section>
  <section class="card" id="mailCard">
    <p class="label">課程通知與單次調整</p>
    <p class="note">正常課表保留。通知只調整指定日期；結束時間未提及時沿用課表並標示。</p>
    <p><button type="button" class="btn" id="gmailConnect">連接成大 Gmail</button>
    <button type="button" class="btn" id="gmailSync">立即收信</button></p>
    <p id="gmailStatus" class="note">尚未連接信箱</p>
    <div id="mailChanges"></div>
    <input id="mailSubject" type="text" placeholder="主旨，例如：下週一教室異動" autocomplete="off"
           style="width:100%;font:inherit;padding:8px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);margin-bottom:8px">
    <textarea id="mailBody" rows="4" placeholder="內文貼這裡"
           style="width:100%;font:inherit;padding:8px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text)"></textarea>
    <p style="margin:10px 0 0"><button type="button" class="btn" id="mailApply">處理通知</button></p>
    <div id="mailResult"></div>
  </section>
  <section class="card" id="lateCard" hidden></section>
  <section class="card" id="scanCard" hidden></section>
  <section class="card" id="classroom" hidden></section>
  <section class="card" id="modeinfo" hidden></section>
  <section class="card" id="parking" hidden></section>
  <section class="card" id="roadEvents" hidden></section>
  <section class="card" id="walk" hidden></section>

  <section class="card" id="gridCard">
    <p class="label">本週課表</p>
    <div class="grid-head">
      <div></div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
    </div>
    <div class="grid-body" id="grid"></div>
  </section>
</div>

<script>
const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const START_HOUR = 8, END_HOUR = 18;
const PX_PER_MIN = 1.05;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const offset = t => (mins(t) - START_HOUR * 60) * PX_PER_MIN;

function describeGap(minutes) {
  if (minutes < 0) return "已開始";
  if (minutes < 60) return `還有 ${minutes} 分鐘`;
  const h = Math.floor(minutes / 60), m = minutes % 60;
  if (h < 24) return m ? `還有 ${h} 小時 ${m} 分` : `還有 ${h} 小時`;
  return `還有 ${Math.floor(h / 24)} 天 ${h % 24} 小時`;
}

const VERDICT = {
  plenty: { label: "時間充裕", cls: "" },
  leave_now: { label: "該出發了", cls: "urgent" },
  too_late: { label: "已經來不及準時抵達", cls: "late" },
};

const TRANSITION_VERDICT = {
  comfortable: { label: "時間充裕", cls: "" },
  tight: { label: "很趕", cls: "urgent" },
  late: { label: "會遲到", cls: "late" },
};

function renderAdvice(r) {
  lastAdvice = r;
  const box = $("advice");
  if (r.error || r.status !== "ok") {
    box.innerHTML = `<p class="label">AI 建議</p>
      <p class="err">${esc(r.error || r.note || "無法取得建議")}</p>`;
    return;
  }
  const cmp = r.comparison;
  const chosen = cmp.options.find(o => o.mode === r.chosen_mode);
  const tag = r.source === "gemini"
    ? '<span class="src">Gemini 建議</span>'
    : '<span class="src rules">規則排序</span>';

  const rows = cmp.options.map(o => {
    const when = o.leave_by ? "最晚 " + o.leave_by.slice(11, 16) + " 出發" : "目前不可行";
    return `<div class="cmp${o.mode === r.chosen_mode ? " win" : ""}">
      <div>${esc(o.label)}<div class="meta">${when}${
        o.risks.length ? "・" + esc(o.risks.join("；")) : ""}</div></div>
      <div>${o.minutes === null ? "—" : o.minutes + " 分"}</div></div>`;
  }).join("");

  box.innerHTML = `<p class="label">AI 建議${tag}</p>
    <p class="advice-pick">${esc(chosen ? chosen.label : r.chosen_mode || "—")}</p>
    <p class="advice-why">${esc(r.reason)}</p>
    ${r.source === "gemini" && pref ? `<p class="note">已參考你的偏好：${esc(pref)}</p>` : ""}
    ${(r.warnings || []).map(w => `<p class="note warn">⚠ ${esc(w)}</p>`).join("")}
    <p class="label" style="margin-top:18px">四個方案</p>${rows}
    ${adviceStale ? '<p class="note warn">⚠ 模擬時間、情境或偏好已改變，這份建議可能已過期，可按「重新詢問」更新。</p>' : ""}
    <p><button type="button" class="btn" id="askAdvice"
       style="margin-top:14px">重新詢問</button></p>`;
}

// 已經問過 Gemini 的情境。課、出發地或車種沒換就不重問，
// 免得每次切換交通方式或每輪輪詢都燒掉一次額度
let adviceSig = "", adviceCtx = "", lastAdvice = null, adviceStale = false;

// 模擬時間、模擬情境與偏好也會影響建議，但不因此自動重問（每次都是一次 Gemini 額度），
// 只標示「可能已過期」，由使用者決定要不要重新詢問
function adviceContext() {
  return [simNow, [...scenarios].sort().join(","), pref].join("|");
}

function autoLoadAdvice(data) {
  const next = data.next_class;
  if (!next) { adviceSig = ""; return; }
  const sig = [next.starts_at, next.location, data.origin, data.vehicle_type].join("|");
  if (sig === adviceSig) {
    if (adviceContext() !== adviceCtx && lastAdvice) { adviceStale = true; renderAdvice(lastAdvice); }
    return;
  }
  adviceSig = sig;
  loadAdvice();
}

function loadAdvice() {
  adviceStale = false;
  adviceCtx = adviceContext();
  $("advice").innerHTML = `<p class="label">AI 建議</p>
    <p class="spinner">正在比較四種交通方式並請 Gemini 判斷…（約 15 秒）</p>`;
  const params = new URLSearchParams({ vehicle });
  if (origin) params.set("origin", origin);
  if (simNow) params.set("now", simNow);
  if (scenarios.size) params.set("scenario", [...scenarios].join(","));
  if (pref) params.set("preference", pref);
  fetch(`/api/recommend?${params}`)
    .then(r => r.json()).then(renderAdvice)
    .catch(e => renderAdvice({ error: e.message }));
}

/* ---------- 教室位置與平面圖 ---------- */

// 同一堂課不重複查：切換交通方式只換導航連結，教室位置不會變
let classroomSig = "", classroomData = null, classroomView = "plan";
// 使用者自己翻到別層時放這裡；null 代表看的還是這堂課那一層
let planOverride = null;

// 大樓是怎麼查出來的。教室代碼最準，用文字換出來的要讓使用者知道
const BUILDING_SOURCE_NOTE = {
  gis_room: "大樓由教室代碼查成大地理資訊系統得出。",
  gis_text: "課表上的地點文字直接在成大 GIS 查到這棟。",
  gis_prefix: "課表沒有教室代碼，剪掉教室描述後在成大 GIS 查到這棟。",
  gemini_building: "課表沒有教室代碼，Gemini 讀出大樓名後由成大 GIS 驗證座標。",
  gemini_room: "課表沒有教室代碼，Gemini 讀出教室名後由成大 GIS 驗證座標。",
  google: "成大 GIS 查不到，座標來自 Google，可能對到隔壁棟。",
};

const FLOOR_SOURCE_NOTE = {
  gis: "樓層取自成大地理資訊系統。",
  floor_plan: "成大 GIS 查不到這個代碼，樓層依平面圖上的標示。",
  room_code: "成大 GIS 查不到，樓層由教室代碼推算。",
};

function renderPlanImage(image, highlight, label = "這裡") {
  if (!image || !image.url) {
    return `<p class="note">${esc((image && image.error_message) || "沒有這一層的平面圖。")}</p>`;
  }
  const mark = highlight
    ? `<div class="plan-mark" style="left:${highlight.left}%;top:${highlight.top}%;
         width:${highlight.width}%;height:${highlight.height}%"><span>${esc(label)}</span></div>`
    : "";
  return `<figure class="plan"><div class="plan-wrap">
      <img src="${esc(image.url)}" alt="${esc(image.caption || "平面圖")}">${mark}</div>
      <figcaption>${esc(image.caption || "")}</figcaption></figure>`;
}

function renderClassroom() {
  const box = $("classroom");
  const r = classroomData;
  if (!r) { box.hidden = true; return; }
  box.hidden = false;

  if (r.status === "error" || r.error) {
    box.innerHTML = `<p class="label">教室位置</p>
      <p class="err">${esc(r.error_message || r.error || "查詢失敗")}</p>`;
    return;
  }

  const plan = r.floor_plan || {};
  const shown = planOverride || plan;
  const figure = classroomView === "campus"
    ? renderPlanImage(r.campus_map, r.campus_map && r.campus_map.highlight,
        r.campus_map && (r.campus_map.highlight_label || r.room_code || r.building_id))
    : renderPlanImage(shown, shown === plan ? plan.highlight : null, r.room_code);

  // 這棟每一層都有圖層時，讓使用者自己翻樓層——找不到教室時常常是記錯樓
  const floorTabs = (plan.floors || []).map(f =>
    `<button data-floor="${esc(f)}" class="${f === (shown.floor || plan.floor) &&
      classroomView === "plan" ? "on" : ""}">${esc(f)}</button>`).join("");
  const tabs = `<div class="plan-tabs">${floorTabs}
    ${r.campus_map ? `<button data-view="campus"
      class="${classroomView === "campus" ? "on" : ""}">校區全圖</button>` : ""}</div>`;

  const loc = r.location || {};
  const coords = loc.lat !== null && loc.lat !== undefined
    ? `${loc.lat.toFixed(5)}, ${loc.lon.toFixed(5)}` : "查不到座標";

  box.innerHTML = `<p class="label">教室位置</p>
    <p class="floor-big">${esc(r.conclusion)}</p>
    <dl class="rows">
      <div class="row"><dt>教室</dt><dd>${esc(r.room_code)}${
        r.room_name ? "（" + esc(r.room_name) + "）" : ""}</dd></div>
      <div class="row"><dt>大樓</dt><dd>${esc(r.building_name || "查不到")}${
        r.building_id ? ' <span class="badge">' + esc(r.building_id) + "</span>" : ""}</dd></div>
      <div class="row"><dt>座標</dt><dd>${esc(coords)}</dd></div>
    </dl>
    ${tabs}
    ${figure}
    ${r.floor_conflict ? `<p class="note warn">⚠ ${esc(r.floor_conflict)}</p>` : ""}
    <p class="note ${r.building_source === "google" ? "warn" : ""}"
      >${esc(BUILDING_SOURCE_NOTE[r.building_source] || "")}</p>
    <p class="note">${esc(FLOOR_SOURCE_NOTE[r.floor_source] || "")}
      ${esc(r.floor_rule || "")}</p>`;
}

function loadClassroom(data) {
  const next = data.next_class;
  const query = next && (next.room_query || next.location);
  if (!query) { classroomSig = ""; classroomData = null; renderClassroom(); return; }
  const sig = query;
  if (sig === classroomSig) { renderClassroom(); return; }
  classroomSig = sig;
  classroomData = null;
  planOverride = null;
  signData = null;
  $("classroom").hidden = false;
  $("classroom").innerHTML = `<p class="label">教室位置</p>
    <p class="spinner">正在查成大地理資訊系統…</p>`;

  const params = new URLSearchParams({ q: query, mode });
  if (origin) params.set("origin", origin);
  fetch(`/api/classroom?${params}`)
    .then(r => r.json())
    .then(r => { classroomData = r; renderClassroom(); })
    .catch(e => { classroomData = { error: e.message }; renderClassroom(); });
}

/* ---------- 拍門牌，確認我在哪 ---------- */

const CONFIDENCE_ZH = { high: "高", medium: "中", low: "低" };

function renderSignResult(r) {
  if (r.status === "error" || r.error) return `<p class="err">${esc(r.error_message || r.error)}</p>`;
  if (r.status === "not_recognized") {
    // 讀出的代碼在成大查不到，多半是讀錯了一個字。列出「只差一個字」的教室讓使用者點選確認；
    // 不自動採用，因為差一個字的教室可能有好幾間，選錯會被帶去別間
    const suggestions = (r.suggestions || []).map(s =>
      `<button type="button" class="ghost" data-here="${esc(s.room_code)}">${esc(s.room_code)}${
        s.room_name ? " " + esc(s.room_name) : ""}・${esc(s.building_name)}${
        s.floor ? " " + esc(s.floor) : ""}</button>`).join(" ");
    return `<p class="note warn">${esc(r.note)}</p>${suggestions ? `<p>${suggestions}</p>` : ""}`;
  }
  const h = r.here;
  const basis = r.sign.confidence === "user"
    ? "代碼由你輸入或確認，並已由成大 GIS 驗證"
    : `辨識信心：${CONFIDENCE_ZH[r.sign.confidence] || "低"}・代碼已由成大 GIS 驗證`;
  return `<div class="trip"><b>你在 ${esc(h.building_name)}${h.floor ? " " + esc(h.floor) : ""}（${esc(h.room_code)}）</b>
    ${r.relation ? `<span>${esc(r.relation.text)}</span>` : ""}
    <span>${esc(basis)}</span></div>`;
}

// 獨立的一張卡片，放在「下一堂課」正下方。原本藏在「教室位置」卡片裡，
// 而那張卡片在教室查詢失敗或沒有下一堂課時根本不會出現，按鈕就跟著消失、找不到
function renderScan() {
  const box = $("scanCard");
  const next = lastData && lastData.next_class;
  // 這張卡片每次載入都會重畫；使用者正在輸入的代碼要保留，不能被沖掉
  const typed = (document.getElementById("hereInput") || {}).value || "";
  const result = signBusy ? '<p class="spinner">正在辨識照片…</p>'
    : (signData ? renderSignResult(signData) : "");
  box.innerHTML = `<p class="label">拍門牌，確認我在哪</p>
    <p class="note" style="margin:0 0 12px">到了大樓卻找不到教室？拍一張教室門牌或樓層指示牌，
      Gemini 讀出上面的字，再由成大地理資訊系統驗證，告訴你現在在哪一間，
      ${next ? `以及「${esc(next.name)}」的教室要往哪一層走` : "在幾樓"}。</p>
    <label class="btn" for="signInput" style="cursor:pointer">📷 拍照或選擇門牌照片</label>
    <input type="file" id="signInput" accept="image/png,image/jpeg,image/webp" capture="environment" hidden>
    <form id="hereForm" class="origin" style="margin:14px 0 0">
      <label for="hereInput">或直接輸入你看到的代碼</label>
      <input id="hereInput" type="text" autocomplete="off" placeholder="例如：A1302、4264">
      <button type="submit">確認</button>
    </form>
    ${result}`;
  $("hereInput").value = typed;
}

// 目標教室：優先用下一堂課的教室代碼，沒有才退回教室位置卡片查到的那間
function targetRoom() {
  const next = lastData && lastData.next_class;
  return (next && next.room_query) || (classroomData && classroomData.room_code) || "";
}

function runSignRequest(request) {
  signBusy = true; signData = null; renderScan();
  request
    .then(r => r.json()).then(r => { signData = r; })
    .catch(e => { signData = { error: e.message }; })
    .finally(() => { signBusy = false; renderScan(); });
}

function scanSign(file) {
  if (!file) return;
  const form = new FormData();
  form.append("file", file);
  const params = new URLSearchParams();
  if (targetRoom()) params.set("target", targetRoom());
  runSignRequest(fetch(`/api/scan_room?${params}`, { method: "POST", body: form }));
}

// 使用者自己輸入或點選確認的代碼：不經過 Gemini，只回成大 GIS 驗證
function confirmHere(code) {
  code = (code || "").trim();
  if (!code) return;
  const params = new URLSearchParams({ code });
  if (targetRoom()) params.set("target", targetRoom());
  runSignRequest(fetch(`/api/here?${params}`));
}

// 判斷會遲到時給的按鈕：產生給老師的通知信「草稿」，使用者確認後自己寄
// 通知信草稿按鈕。kind 是 late（遲到）或 leave（請假）。reason 通常留空，
// 由使用者在草稿裡自己填——真正的原因我們不知道，不能替他編
function noticeButton(course, startsAt, minutes, place, kind = "late", reason = "", label = "") {
  const text = label || (kind === "leave" ? "產生請假通知信草稿" : "產生遲到通知信草稿");
  return `<button type="button" class="ghost" data-late="1" data-kind="${esc(kind)}"
    data-course="${esc(course)}" data-starts="${esc(startsAt)}" data-min="${esc(minutes)}"
    data-place="${esc(place || "")}" data-reason="${esc(reason)}">${esc(text)}</button>`;
}

function lateButton(course, startsAt, minutes, place) {
  return `<p>${noticeButton(course, startsAt, minutes, place)}</p>`;
}

// 課間轉場：正在上課或剛下課、下一堂很快開始時，從上一堂教室走過去來不來得及。
// 出發地就是上一堂教室，跟下面「從出發地出發」的規劃是兩件事，所以分開顯示。
function renderTransition(data) {
  const t = data.transition;
  if (!t) return "";
  if (t.status !== "ok") return `<p class="note">${esc(t.note || "算不出課間轉場時間。")}</p>`;

  const v = TRANSITION_VERDICT[t.verdict] || { label: t.verdict, cls: "" };
  const move = t.same_building
    ? "同一棟，不必移動"
    : `走路約 ${t.walk_minutes} 分（${t.distance_m} 公尺）`;
  return `<div class="trip ${v.cls}">
    <b>課間轉場・${esc(v.label)}</b>
    <span>${esc(t.from.place)} → ${esc(t.to.place)}</span>
    <span>下課後 ${t.gap_minutes} 分鐘・${move}＋緩衝 ${t.buffer_minutes} 分（估算）</span>
  </div>
  <p class="note${t.verdict === "late" ? " warn" : ""}">${esc(t.advice)}</p>
  ${t.verdict === "late" ? lateButton(t.to.course, t.to.starts_at, t.late_by, t.to.place) : ""}`;
}

function renderTrip(data) {
  const d = data.departure;
  if (!d || d.status !== "ok") return "";
  if (!d.verdict) return `<p class="note">${esc(d.note || "無法推算出發時刻。")}</p>`;

  const v = VERDICT[d.verdict] || { label: d.verdict, cls: "" };
  const at = d.leave_at.slice(11, 16);
  const gap = d.minutes_until_departure;
  const when = gap >= 0 ? describeGap(gap) : `已經超過 ${Math.abs(gap)} 分鐘`;
  const w = d.weather;

  return `<div class="trip ${v.cls}">
    <b>${at} 出發・${esc(v.label)}</b>
    <span>${esc(when)}</span>
    <span>${esc(data.travel_mode_label)} ${d.travel_minutes} 分＋進教室緩衝 ${d.buffer_minutes} 分
      ${d.is_estimate ? "（估算）" : "（Google 實際路線）"}</span>
    ${w ? `<span>出發時 ${esc(w.weather || "—")}・降雨機率
      ${w.rain_probability === null ? "無資料" : w.rain_probability + "%"}・體感
      ${esc(w.apparent_temperature || "—")}°C</span>` : ""}
  </div>
  ${d.weather_advice ? `<p class="note warn">${esc(d.weather_advice)}</p>` : ""}
  ${d.verdict === "too_late" ? lateButton(d.course.name, d.class_starts_at,
      Math.abs(d.minutes_until_departure), d.course.building || d.course.location) : ""}`;
}

function stationRows(list, key, unit, role) {
  if (!list.length) return '<p class="note">附近沒有符合條件的站點。</p>';
  const picked = role === "from" ? bikePick.from : bikePick.to;
  return list.map(s => `<button type="button" class="lot pickable${
      s.name === picked ? " picked" : ""}" data-role="${esc(role)}"
      data-station="${esc(s.name)}"><div><b>${esc(s.name)}</b>
    <div class="meta">${s.distance_m} 公尺・走 ${s.walk_minutes} 分</div></div>
    <div class="free">${s[key]} ${unit}</div></button>`).join("");
}

function renderBikeJourney() {
  const box = $("bikejourney");
  if (!box) return;
  const j = bikeJourney;
  if (!j) {
    const need = !bikePick.from ? "借車站" : (!bikePick.to ? "還車站" : "");
    box.innerHTML = need
      ? `<p class="note">點選上方的${need}，即可估算整趟時間。</p>`
      : '<p class="spinner">計算中…</p>';
    return;
  }
  if (j.status !== "ok") {
    box.innerHTML = `<p class="err">${esc(j.error || j.error_message)}</p>`;
    return;
  }
  const w1 = j.walk_to_station, r = j.ride, w2 = j.walk_to_destination;
  box.innerHTML = `<div class="trip">
      <b>${j.total_minutes === null ? "無法計算總時間" : "整趟約 " + j.total_minutes + " 分鐘"}</b>
      <span>走到 ${esc(j.from_station.name)} ${w1.minutes} 分（${w1.distance_m} 公尺）${j.from_station.address ? "・" + esc(j.from_station.address) : ""}</span>
      <span>＋ 騎到 ${esc(j.to_station.name)}${
        j.to_station.address ? "（" + esc(j.to_station.address) + "）" : ""} ${
        r.minutes === null ? "—" : r.minutes + " 分"}
        ${r.distance_m ? "（" + r.distance_m + " 公尺）" : ""}
        ${r.is_estimate ? "（估算）" : "（Google 實際路線）"}</span>
      <span>＋ 走到 ${esc(j.destination)} ${w2.minutes} 分（${w2.distance_m} 公尺）</span>
    </div>
    ${r.unavailable_reason ? `<p class="note err">${esc(r.unavailable_reason)}</p>` : ""}
    <p><a class="btn" href="${esc(j.map_link)}" target="_blank" rel="noopener">在 Google 地圖查看整條路線</a></p>
    <p class="note">${esc(j.note)}</p>`;
}

function loadBikeJourney() {
  if (!bikePick.from || !bikePick.to) { bikeJourney = null; renderBikeJourney(); return; }
  bikeJourney = null;
  renderBikeJourney();
  const params = new URLSearchParams({ from_station: bikePick.from, to_station: bikePick.to });
  if (origin) params.set("origin", origin);
  fetch(`/api/youbike/route?${params}`)
    .then(r => r.json())
    .then(data => { bikeJourney = data.status ? data : { status: "error", ...data };
                    renderBikeJourney(); })
    .catch(e => { bikeJourney = { status: "error", error: e.message }; renderBikeJourney(); });
}

function renderModeInfo(data) {
  const box = document.getElementById("modeinfo");
  const parts = [];

  // 借車站、公車站都要以「出發地」為中心去找。沒填出發地時後端根本不會查，
  // 畫面上就什麼都沒有，看起來像功能不見了，所以明講要先填出發地
  if (!data.origin && data.next_class) {
    if (data.travel_mode === "bicycling") {
      parts.push('<p class="label">YouBike・附近站點</p>'
        + '<p class="note">請先在上方「出發地」填入你的位置（例如：成大圖書館），'
        + '才查得到附近還有車可借的 YouBike 站。</p>');
    } else if (data.travel_mode === "transit") {
      parts.push('<p class="label">公車・出發地附近</p>'
        + '<p class="note">請先在上方「出發地」填入你的位置，才查得到附近站牌的即時到站時間。</p>');
    }
  }

  if (data.bikes) {
    const b = data.bikes.borrow, r = data.bikes["return"];
    parts.push(`<p class="label">YouBike・出發地借車</p>`);
    parts.push(b.status === "error" ? `<p class="err">${esc(b.error_message)}</p>`
               : stationRows(b.stations || [], "bikes", "可借", "from"));
    parts.push(`<p class="label" style="margin-top:20px">YouBike・目的地還車</p>`);
    parts.push(r.status === "error" ? `<p class="err">${esc(r.error_message)}</p>`
               : stationRows(r.stations || [], "docks", "空位", "to"));
    parts.push('<div id="bikejourney" style="margin-top:20px"></div>');
  }

  if (data.bus) {
    const bus = data.bus;
    parts.push(`<p class="label">公車・出發地附近</p>`);
    if (bus.status === "error") {
      parts.push(`<p class="err">${esc(bus.error_message)}</p>`);
    } else if (!(bus.arrivals || []).length) {
      parts.push(`<p class="note">${esc(bus.note || "目前沒有班次資訊。")}</p>`);
    } else {
      parts.push(bus.arrivals.map(a => `<div class="lot"><div><b>${esc(a.route)}</b>
        <div class="meta">${esc(a.stop)}</div></div>
        <div class="free">${a.minutes} 分</div></div>`).join(""));
    }
  }

  box.hidden = parts.length === 0;
  box.innerHTML = parts.join("");
  if (data.bikes) renderBikeJourney();
}

// 導航座標是怎麼來的。課表寫的地點常常查不到，使用者有權知道
// 那個「開啟導航」按鈕到底把他帶去哪、可不可信
function describePlace(next) {
  const p = next.place;
  if (!p || p.status !== "ok") {
    const why = (p && p.error_message) || "查不到這個地點的座標";
    return `<p class="note err">${esc(why)}，導航改用課表原文，位置可能不準。</p>`;
  }
  const where = esc(p.name) + (p.build_id ? `（${esc(p.build_id)}）` : "");
  if (p.source === "gis_room_code" || p.source === "gis_text") {
    return `<p class="note">導航座標取自成大地理資訊系統：${where}。</p>`;
  }
  if (p.source === "gemini_room" || p.source === "gemini_building") {
    return `<p class="note">課表寫「${esc(next.location)}」查不到，Gemini 判讀成
      「${esc(p.gemini_keyword)}」，再由成大 GIS 查出 ${where} 的座標。</p>`;
  }
  return `<p class="note warn">⚠ 成大 GIS 查不到這個地點，座標來自 Google
    （${where}），可能對到隔壁棟。</p>`;
}

/* ---------- 出席檢查：正在上課時，你在不在教室 ---------- */

// 請假、遲到的真正原因我們不知道，草稿裡留成這個佔位，由使用者自己換掉
const REASON_PLACEHOLDER = "【請填寫原因】";

function geoButton() {
  return geoPos
    ? '<button type="button" class="ghost" data-geo="off">改用輸入的地點</button>'
    : '<button type="button" class="ghost" data-geo="on">📍 用我的目前位置</button>';
}

function renderAttendance(data) {
  const cur = data.current_class;
  if (!cur) return "";
  const a = data.attendance;
  const geoNote = geoError ? `<p class="note warn">${esc(geoError)}</p>` : "";

  if (!a || a.status === "no_location") {
    return `<p class="note">現在正在上課。在上方「出發地」輸入你現在的位置，
        或按「用我的目前位置」，就能判斷你是不是在教室。位置只用來這一次判斷，不會儲存。</p>
      <p>${geoButton()}</p>${geoNote}`;
  }
  if (a.status !== "ok") {
    return `<p class="note warn">${esc(a.note || "無法判斷你在不在教室。")}</p>
      <p>${geoButton()}</p>${geoNote}`;
  }

  const here = a.here;
  const source = here.source === "gps"
    ? "即時位置" + (geoPos ? `，取得於 ${geoPos.at.toTimeString().slice(0, 5)}、精度約 ±${
        Math.round(geoPos.accuracy)} 公尺` : "")
    : "你輸入的地點";
  const timing = `課已開始 ${a.elapsed_minutes} 分・還剩 ${a.remaining_minutes} 分`;

  if (a.at_class) {
    return `<div class="trip"><b>出席檢查・你在教室附近</b>
        <span>${esc(here.name)}（${esc(source)}），距教室約 ${a.distance_m} 公尺</span>
        <span>${timing}</span></div>
      <p class="note">${esc(a.note)}</p><p>${geoButton()}</p>${geoNote}`;
  }

  // 不在教室：遲到信與請假信都給，依情況標出建議的那一種
  const c = a.class, place = c.building || c.location;
  const lateBtn = noticeButton(c.name, c.starts_at, a.late_by, place, "late", REASON_PLACEHOLDER,
    "產生遲到通知信草稿" + (a.suggestion === "late" ? "（建議）" : ""));
  const leaveBtn = noticeButton(c.name, c.starts_at, 0, place, "leave", "",
    "產生請假通知信草稿" + (a.suggestion === "leave" ? "（建議）" : ""));
  return `<div class="trip late"><b>出席檢查・你不在上課的教室</b>
      <span>${esc(here.name)}（${esc(source)}），距教室約 ${a.distance_m} 公尺</span>
      <span>${timing}・走過去約 ${a.walk_minutes} 分</span></div>
    <p class="note warn">${esc(a.advice)}</p>
    <p>${a.suggestion === "leave" ? leaveBtn + " " + lateBtn : lateBtn + " " + leaveBtn}</p>
    <p>${geoButton()}</p>${geoNote}
    <p class="note">${esc(a.note)}</p>`;
}

function renderGrid(data) {
  const grid = document.getElementById("grid");
  const height = (END_HOUR - START_HOUR) * 60 * PX_PER_MIN;
  grid.style.height = `${height}px`;

  let html = '<div class="axis">';
  for (let h = START_HOUR; h <= END_HOUR; h++) {
    html += `<span style="top:${(h - START_HOUR) * 60 * PX_PER_MIN}px">${h}:00</span>`;
  }
  html += "</div>";

  const nextKey = data.next_class ? data.next_class.name + data.next_class.start_time : null;
  const curKey = data.current_class ? data.current_class.name + data.current_class.start_time : null;
  const now = new Date(data.now);
  const nowDay = (now.getDay() + 6) % 7;

  DAYS.forEach((day, i) => {
    html += '<div class="col">';
    for (let h = START_HOUR; h <= END_HOUR; h++) {
      html += `<div class="hour" style="top:${(h - START_HOUR) * 60 * PX_PER_MIN}px"></div>`;
    }
    data.courses.filter(c => c.day === day).forEach(c => {
      const occurrence = new Date(now);
      occurrence.setDate(now.getDate() - nowDay + i);
      const dateKey = `${occurrence.getFullYear()}-${String(occurrence.getMonth()+1).padStart(2,'0')}-${String(occurrence.getDate()).padStart(2,'0')}`;
      const change = (c._changes || []).find(x => x.status === 'active' && x.effective_date === dateKey);
      if (change) {
        const originalTop = offset(c.start_time);
        html += `<div class="block" style="top:${originalTop}px;height:24px;border:1px dashed #777;opacity:.65;background:#eee"><small>原 ${esc(c.start_time)} · 本次調整</small></div>`;
        c = {...c, ...change.patch};
      }
      const top = offset(c.start_time);
      const h = (mins(c.end_time) - mins(c.start_time)) * PX_PER_MIN;
      const key = c.name + c.start_time;
      const cls = key === curKey ? " is-current" : (key === nextKey ? " is-next" : "");
      html += `<div class="block${cls}" style="top:${top}px;height:${h - 3}px">
        <b>${esc(c.name)}</b><small>${esc(c.location)}</small>${change ? `<small style="color:#8b2433">單次調整 ${esc(change.effective_date)} · ${esc(c.start_time)}<br>結束時間沿用課表</small>` : ''}</div>`;
    });
    if (i === nowDay) {
      const t = (now.getHours() * 60 + now.getMinutes() - START_HOUR * 60) * PX_PER_MIN;
      if (t >= 0 && t <= height) html += `<div class="nowline" style="top:${t}px"></div>`;
    }
    html += "</div>";
  });
  grid.innerHTML = html;
}

function loadWalk(data) {
  const rec = data.parking && data.parking.recommended;
  const next = data.next_class;
  // 只有要停車才需要這段；走路或搭公車不會經過停車場
  if (!rec || !next) { walkSig = ""; walkData = null; renderWalk(); return; }

  const sig = [rec.name, next.location].join("|");
  if (sig === walkSig) { renderWalk(); return; }
  walkSig = sig;
  walkData = null;
  const box = document.getElementById("walk");
  box.hidden = false;
  box.innerHTML = `<p class="label">停好車之後怎麼走</p>
    <p class="spinner">正在畫從停車場到教室的路線…</p>`;

  const params = new URLSearchParams({ lot: rec.name, q: next.location,
                                       room: next.room_query || "" });
  fetch(`/api/campuswalk?${params}`)
    .then(r => r.json())
    .then(r => { walkData = r; renderWalk(); })
    .catch(e => { walkData = { status: "error", error_message: e.message }; renderWalk(); });
}

function isClosedRoadEvent(event) {
  const text = [event.description, event.category, event.road_name]
    .filter(Boolean).join(" ");
  return event.is_closure || /封閉|封路|禁止通行|管制|施工/.test(text);
}

function renderEventSide(label, side) {
  if (!side.resolved) {
    return `<p class="label">${esc(label)}</p><p class="note">${esc(side.note)}</p>`;
  }
  if (side.note) {
    return `<p class="label">${esc(label)}・${esc(side.name)}</p><p class="err">${esc(side.note)}</p>`;
  }
  const events = side.events || [];
  const closureCount = Number(side.closure_count || 0)
    || events.filter(isClosedRoadEvent).length;
  const closureWarning = side.has_closed_route || closureCount
    ? `<p class="note warn">⚠ 導航路線有 ${closureCount || 1} 件封閉路段或交通管制，請改道。</p>`
    : "";
  if (!events.length) {
    return `<p class="label">${esc(label)}・${esc(side.name)}</p><p class="event-clear">附近沒有回報的路況事件</p>`;
  }
  const rows = events.map(e => {
    const what = e.description || (e.type_is_code ? `分類代碼 ${e.type_code}` : "（無說明）");
    const tag = (isClosedRoadEvent(e) ? `<span class="badge">封閉路段</span> ` : "")
      + (e.category ? `<span class="badge">${esc(e.category)}</span> ` : "");
    return `<div class="event"><div class="dist">${e.distance_m}m</div>
      <div><b>${tag}${esc(what)}</b><div class="meta">${esc(e.road_name || "（無地點資訊）")}</div></div></div>`;
  }).join("");
  return `<p class="label">${esc(label)}・${esc(side.name)}</p>${closureWarning}${rows}`;
}

function renderRoadEvents(data) {
  const box = document.getElementById("roadEvents");
  const r = data.road_events;
  if (!r) { box.hidden = true; return; }
  box.hidden = false;

  if (r.status === "error") {
    box.innerHTML = `<p class="label">路況（半徑 ${r.radius_m}m）</p><p class="err">${esc(r.note)}</p>`;
    return;
  }

  const route = r.route;
  if (route && route.resolved) {
    box.innerHTML =
      `<p class="label" style="margin-bottom:4px">路況（Google Maps 路線周邊 ${r.radius_m}m）</p>`
      + `<div class="event-side">${renderEventSide("沿途路線", route)}</div>`;
    return;
  }

  box.innerHTML =
    `<p class="label" style="margin-bottom:4px">路況（端點周邊 ${r.radius_m}m）</p>`

    + `<div class="event-side">${renderEventSide("目的地周邊", r.destination)}</div>`;
}

const $ = id => document.getElementById(id);
// 一分鐘拉一次就夠：倒數由前端自己跳，不必靠輪詢，也少打成大的系統
const POLL_MS = 60000;
const SECTIONS = ["demoCard", "originForm", "prefForm", "modes", "hero", "scanCard", "classroom",
                  "parking", "roadEvents", "walk", "mailCard", "lateCard", "gridCard"];

let bikePick = { from: null, to: null }, bikeJourney = null;
let mode = "walking", vehicle = "機車", origin = "";
let simNow = "", leadMin = 30;
let lastData = null, notice = null, pollTimer = null, bannerSig = "", notifiedKey = "";

function routeUpdateSignature(data) {
  const next = (data && data.next_class) || {};
  const departure = (data && data.departure) || {};
  const road = (data && data.road_events) || {};
  const sides = [road.route, road.origin, road.destination].filter(Boolean);
  const events = sides.flatMap(side => (side.events || []).map(event => ({
    id: event.id || event.event_id || "",
    type: event.type || event.category || "",
    description: event.description || "",
    road_name: event.road_name || "",
    distance_m: event.distance_m || null,
  }))).sort((a, b) => JSON.stringify(a).localeCompare(JSON.stringify(b)));
  return JSON.stringify({
    class_key: `${next.name || ""}|${next.starts_at || ""}`,
    route_link: next.route_link || "",
    travel_minutes: departure.travel_minutes ?? null,
    distance_m: departure.distance_m ?? null,
    leave_at: departure.leave_at || "",
    events,
  });
}

function sameUpcomingClass(a, b) {
  const left = (a && a.next_class) || {}, right = (b && b.next_class) || {};
  return left.name && left.starts_at && left.name === right.name && left.starts_at === right.starts_at;
}

function routeUpdateDelta(previous, current) {
  const before = Number(previous && previous.departure && previous.departure.travel_minutes);
  const after = Number(current && current.departure && current.departure.travel_minutes);
  return Number.isFinite(before) && Number.isFinite(after) ? after - before : null;
}

function showRouteUpdate(previous, current, { demo = false } = {}) {
  const box = $("routeUpdate"), content = $("routeUpdateContent");
  const next = (current && current.next_class) || (previous && previous.next_class) || {};
  const before = previous && previous.departure && previous.departure.travel_minutes;
  const after = current && current.departure && current.departure.travel_minutes;
  const delta = routeUpdateDelta(previous, current);
  const change = delta === null
    ? "路線資料已變更，請重新確認建議出發時間。"
    : delta > 0
      ? `預估路程增加 ${delta} 分鐘，建議提早出發。`
      : delta < 0
        ? `預估路程縮短 ${Math.abs(delta)} 分鐘。`
        : "路線或沿途路況已更新，預估時間沒有變化。";
  const title = demo ? "展示：路線已更新" : "路線已更新";
  const times = before !== null && before !== undefined && after !== null && after !== undefined
    ? `<p class="note">${esc(String(before))} 分鐘 → ${esc(String(after))} 分鐘</p>` : "";
  box.hidden = false;
  content.innerHTML = `<h2 class="course-name">${esc(title)}</h2>
    <p>${esc(next.name || "下一堂課")}：${esc(change)}</p>${times}
    <p class="note">${demo ? "這是展示資料，不會修改課表或後端資料。" : "系統已在背景輪詢中偵測到變更。"}</p>`;

  if (!demo && "Notification" in window && Notification.permission === "granted") {
    try {
      new Notification("路線已更新", { body: `${next.name || "下一堂課"}：${change}` });
    } catch (e) { /* 瀏覽器可能禁止背景通知 */ }
  }
}

// 只存在使用者自己的瀏覽器：私密視窗等情況拿不到儲存空間時，當作沒有，不影響其他功能
const LS = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 略過 */ } },
};

// 模擬情境：Demo 用來重現「環境突然改變」。只存在這個分頁，每次請求帶給後端，後端不保存
let scenarios = new Set();
// 自動調整：開啟後每次載入都檢查目前的交通方式還行不行，不行就自己換並記下原因。
// knownSoft 是上一輪已經接受的風險，帶回後端，同樣的風險就不必每輪重新比較四種方式
// 模擬情境按鈕、自動調整開關與調整記錄：功能都在（後端、測試也都在），但操作不夠直觀，
// 先從畫面上藏起來。要重新打開，把這個旗標改成 true 即可
const SHOW_ADAPTIVE = false;
let autoMode = SHOW_ADAPTIVE && LS.get("autoMode", false), knownSoft = [], skipReplan = false;
let adjustLog = LS.get("adjustLog", []), autoStatus = "";
let pref = LS.get("commutePref", "");
let signData = null, signBusy = false;
// 即時位置（使用者按「用我的目前位置」才取得）。只放在記憶體，不存進 localStorage
let geoPos = null, geoError = "";
$("prefInput").value = pref;

// 模擬時間下的「現在」是凍結的，倒數不該繼續往前跑
function effectiveNow() {
  return simNow && lastData ? new Date(lastData.now) : new Date();
}
function minutesUntil(iso) {
  return Math.round((new Date(iso) - effectiveNow()) / 60000);
}
// datetime-local 只吃本地時間的 YYYY-MM-DDTHH:MM，不能直接丟 ISO
function toLocalInput(d) {
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`
    + `T${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ---------- 上傳課表 ---------- */

function noticeHtml() {
  if (!notice) return "";
  const skipped = (notice.skipped || []).length
    ? `<p class="warn">有 ${notice.skipped.length} 堂沒讀成功：`
      + esc(notice.skipped.map(s => `${s.name}（${s.reason}）`).join("、")) + "</p>"
    : "";
  const cls = notice.type === "err" ? "err" : "note";
  return `<p class="${cls}" style="margin-top:14px">${esc(notice.text)}</p>${skipped}`;
}

function renderUpload(data) {
  const box = $("uploadCard");
  if (!data.has_schedule) {
    box.innerHTML = `<div class="upload" id="drop">
      <h2>先上傳你的課表</h2>
      <p>丟一張課表截圖進來，系統會自己讀出課程、時間與教室。</p>
      <label class="filebtn" for="fileInput">選擇課表圖片</label>
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp">
      <p class="note" style="margin-top:14px">PNG / JPG / WebP，8 MB 以內，也可以直接把圖拖進這個框。</p>
      ${data.has_sample ? '<p style="margin:14px 0 0"><button type="button" class="ghost" id="useSample">用範例課表</button></p>' : ""}
      ${noticeHtml()}
    </div>`;
  } else {
    box.innerHTML = `<div class="srcline">
      <span class="grow">課表來源：${esc(data.schedule_source || "未記錄")}・共 ${data.courses.length} 堂</span>
      <a class="ghost" href="/api/calendar.ics" style="text-decoration:none">匯出課表 (.ics)</a>
      <label class="ghost" for="fileInput" style="cursor:pointer">重新上傳</label>
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp">
      <button type="button" class="ghost" id="clearSchedule">清除課表</button>
    </div>${noticeHtml()}`;
  }
  notice = null;
  wireUpload();
}

function wireUpload() {
  const input = $("fileInput");
  if (input) input.addEventListener("change", e => uploadFile(e.target.files[0]));

  const drop = $("drop");
  if (drop) {
    ["dragenter", "dragover"].forEach(evt => drop.addEventListener(evt, e => {
      e.preventDefault(); drop.classList.add("drag");
    }));
    ["dragleave", "drop"].forEach(evt => drop.addEventListener(evt, e => {
      e.preventDefault(); drop.classList.remove("drag");
    }));
    drop.addEventListener("drop", e => uploadFile(e.dataTransfer.files[0]));
  }

  const sample = $("useSample");
  if (sample) sample.addEventListener("click", () => {
    fetch("/api/schedule/sample", { method: "POST" })
      .then(r => r.json())
      .then(body => {
        notice = body.error ? { type: "err", text: body.error }
          : { type: "ok", text: `已載入範例課表，共 ${body.imported} 堂。` };
        load();
      });
  });

  const clear = $("clearSchedule");
  if (clear) clear.addEventListener("click", () => {
    if (!confirm("確定要清除目前的課表嗎？清除後要重新上傳。")) return;
    fetch("/api/schedule", { method: "DELETE" }).then(() => { simNow = ""; load(); });
  });
}

function uploadFile(file) {
  if (!file) return;
  $("uploadCard").innerHTML =
    `<p class="spinner">正在讀取「${esc(file.name)}」…辨識課表大約需要幾秒鐘。</p>`;
  const form = new FormData();
  form.append("file", file);
  fetch("/api/schedule/import", { method: "POST", body: form })
    .then(r => r.json().then(body => ({ ok: r.ok, body })))
    .then(({ ok, body }) => {
      notice = ok
        ? { type: "ok", text: `辨識完成，讀到 ${body.imported} 堂課。`, skipped: body.skipped }
        : { type: "err", text: body.error || "辨識失敗", skipped: body.skipped };
      if (ok) simNow = "";
      load();
    })
    .catch(e => { notice = { type: "err", text: `上傳失敗：${e.message}` }; load(); });
}

/* ---------- 上課提醒 ---------- */

function pushNotify(next, minutes, where) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try {
    new Notification(`${next.name}・${describeGap(minutes)}上課`,
                     { body: `${next.start_time} 開始・${where}` });
  } catch (e) { /* 部分瀏覽器在非 HTTPS 下會擋，忽略即可 */ }
}

function renderBanner() {
  const box = $("banner"), d = lastData, next = d && d.next_class;
  const off = () => { box.className = "banner"; box.innerHTML = ""; bannerSig = ""; };
  if (!next || !d.has_schedule) { off(); return; }

  const minutes = minutesUntil(next.starts_at);
  if (minutes < 0 || minutes > leadMin) { off(); notifiedKey = ""; return; }

  const key = next.name + next.starts_at;
  const sig = `${key}|${minutes}`;
  if (sig === bannerSig) return;   // 一分鐘只重畫一次，避免導航連結一直被重建
  bannerSig = sig;

  const where = (next.building_name || next.location) + (next.floor ? ` ${next.floor}` : "");
  const bits = [];
  // 時間改由 departure 提供：它已含停車與進教室的緩衝，比單純的路程時間貼近實際
  const dep = d.departure;
  if (dep && dep.travel_minutes !== null && dep.travel_minutes !== undefined) {
    bits.push(`${d.travel_mode_label}${dep.is_estimate ? "約 " : " "}${dep.travel_minutes} 分鐘`);
  }
  if (dep && dep.leave_at) bits.push(`建議 ${dep.leave_at.slice(11, 16)} 出發`);
  if (d.parking && d.parking.recommended) {
    bits.push(`${d.parking.recommended.name}還有 ${d.parking.recommended.available} 位`);
  }

  box.className = "banner on";
  box.innerHTML = `<p class="label">該出發了</p>
    <h2>${esc(next.name)}・${describeGap(minutes)}上課</h2>
    <p>${esc(next.day_zh)} ${esc(next.start_time)} 開始・${esc(where)}${
      next.corrected ? `（課表寫「${esc(next.location)}」，已修正）` : ""}</p>
    ${bits.length ? `<p>${esc(bits.join("・"))}</p>` : ""}
    <a class="btn" href="${esc(next.route_link)}" target="_blank"
       rel="noopener">開啟${esc(d.travel_mode_label)}導航</a>`;

  if (notifiedKey !== key) { notifiedKey = key; pushNotify(next, minutes, where); }
}

function tick() {
  document.querySelectorAll("[data-until]").forEach(el => {
    el.textContent = describeGap(minutesUntil(el.dataset.until)) + (el.dataset.suffix || "");
  });
  renderBanner();
}

/* ---------- 載入 ---------- */

function schedulePoll() {
  clearTimeout(pollTimer);
  if (simNow) return;   // 模擬時間是凍結的，不需要也不該繼續打後端
  pollTimer = setTimeout(load, POLL_MS);
}

function load() {
  clearTimeout(pollTimer);
  $("hero").innerHTML = '<p class="spinner">查詢中…</p>';
  // 每個模式查的資料不同，載入提示也要講清楚在等什麼
  const busy = { driving: ["parking", "正在比對全校停車場車位…"],
                 bicycling: ["modeinfo", "正在查 YouBike 即時車位…"],
                 transit: ["modeinfo", "正在查公車到站時間…"] }[mode];
  if (busy) {
    const el = $(busy[0]);
    el.hidden = false;
    el.innerHTML = `<p class="spinner">${busy[1]}</p>`;
  } else {
    $("modeinfo").hidden = true;
    $("parking").hidden = true;
  }
  const params = new URLSearchParams({ mode, vehicle });
  if (origin) params.set("origin", origin);
  if (simNow) params.set("now", simNow);
  if (scenarios.size) params.set("scenario", [...scenarios].join(","));
  if (geoPos) {
    params.set("lat", geoPos.lat);
    params.set("lon", geoPos.lon);
    params.set("accuracy", Math.round(geoPos.accuracy || 0));
  }

  fetch(`/api/state?${params}`)
    .then(r => r.json())
    .then(data => {
      if (!("has_schedule" in data)) {   // 400：設定或參數有問題
        $("hero").innerHTML = `<p class="err">${esc(data.error)}</p>`;
        return;
      }
      const previousData = lastData;
      if (previousData && previousData.has_schedule && data.has_schedule
          && sameUpcomingClass(previousData, data)
          && routeUpdateSignature(previousData) !== routeUpdateSignature(data)) {
        showRouteUpdate(previousData, data);
      } else if (previousData && !sameUpcomingClass(previousData, data)) {
        $("routeUpdate").hidden = true;
      }
      lastData = data;
      const now = new Date(data.now);
      $("clock").innerHTML =
        esc(now.toLocaleString("zh-TW", { dateStyle: "full", timeStyle: "short" }))
        + (data.simulated ? ' <span class="simbadge">模擬時間</span>' : "")
        + ((data.scenarios && data.scenarios.active.length)
            ? ' <span class="simbadge">模擬情境</span>' : "")
        + `・出發地 ${esc(data.origin || "目前位置")}`
        + (data.using_default_origin ? "（預設）" : "")
        + rainText(data);

      renderUpload(data);
      SECTIONS.forEach(id => { const el = $(id); if (el) el.hidden = !data.has_schedule; });
      if (SHOW_ADAPTIVE) {
        $("scenarioBox").hidden = false;
        $("autoBar").hidden = !data.has_schedule;
      }
      if (!data.has_schedule) {
        $("banner").className = "banner";
        bannerSig = "";
        $("routeUpdate").hidden = true;
        if (data.error) $("uploadCard").innerHTML += `<p class="err">${esc(data.error)}</p>`;
        renderAdjust();
        return;
      }

      $("originInput").placeholder = data.default_origin || "例如：成大圖書館";
      $("leadSelect").value = String(leadMin);
      $("simTime").value = simNow || toLocalInput(now);
      renderModes(data.modes, data.travel_mode, data.vehicle_type);
      renderScenarioChips(data);
      $("autoMode").checked = autoMode;
      renderHero(data);
      loadClassroom(data);
      renderScan();
      autoLoadAdvice(data);
      renderModeInfo(data);
      renderParking(data);
      renderRoadEvents(data);
      loadWalk(data);
      renderGrid(data);
      bannerSig = "";
      renderBanner();
      schedulePoll();
      maybeReplan();
    })
    .catch(e => {
      $("hero").innerHTML = `<p class="err">無法連線後端：${esc(e.message)}</p>`;
    });
}

/* ---------- 模擬情境、自動調整與調整記錄 ---------- */

// 雨量站的即時讀數（實測，不是預報）。模擬情境下會標示，免得把覆寫值當成真的
function rainText(data) {
  const r = data.rain_now;
  if (!r || r.status !== "ok" || !r.station) return "";
  const mm = r.past10min_mm === null || r.past10min_mm === undefined ? "—" : r.past10min_mm;
  const state = r.is_raining ? "正在下雨" : (r.level === "none" ? "無雨" : "剛下過雨");
  return `・${esc(r.station.name)}雨量站 ${state}（10 分鐘 ${mm} mm）`
    + (r.simulated ? ' <span class="simbadge">模擬</span>' : "");
}

function scenarioShortName(options, key) {
  return (options[key] || key).split("：")[0];
}

function renderScenarioChips(data) {
  const options = (data.scenarios && data.scenarios.options) || {};
  $("scenarioChips").innerHTML = Object.entries(options).map(([key, label]) =>
    `<button type="button" class="chip" data-scenario="${esc(key)}" title="${esc(label)}"
      aria-pressed="${scenarios.has(key)}">${esc(scenarioShortName(options, key))}</button>`).join("")
    + (scenarios.size ? '<button type="button" class="chip clear" data-scenario="">清除模擬</button>' : "");
  $("scenarioNote").textContent = scenarios.size
    ? "模擬中：" + [...scenarios].map(k => options[k] || k).join("；")
      + "。只有被指定的那項資料被換掉，其餘仍是真實查詢，畫面會標示「模擬」。"
    : "按下情境可重現「環境突然改變」；開啟「自動調整交通方式」後，看系統會不會自己換。";
}

function pushAdjust(entry) {
  if (adjustLog.length && adjustLog[0].text === entry.text) return;   // 同一句話不連續重複記
  adjustLog = [entry, ...adjustLog].slice(0, 30);
  LS.set("adjustLog", adjustLog);
}

function renderAdjust() {
  const box = $("adjust");
  const show = SHOW_ADAPTIVE && lastData && lastData.has_schedule && (autoMode || adjustLog.length);
  box.hidden = !show;
  if (!show) return;
  const items = adjustLog.map(e => `<div class="adj ${esc(e.kind)}">
    <div class="adj-time">${esc(e.time)}</div>
    <div><div>${esc(e.text)}</div>${e.sim ? `<div class="meta">模擬情境：${esc(e.sim)}</div>` : ""}</div>
  </div>`).join("");
  box.innerHTML = `<p class="label">調整記錄${autoMode ? '<span class="src">自動監控中</span>' : ""}</p>
    ${autoStatus ? `<p class="note">${esc(autoStatus)}</p>` : ""}
    ${items || '<p class="note">還沒有調整。環境改變、原本的交通方式行不通時，系統換了會記在這裡。</p>'}
    ${adjustLog.length ? '<p><button type="button" class="ghost" id="clearAdjust">清除記錄</button></p>' : ""}`;
}

// 每次載入完成後，檢查目前的交通方式還行不行；不行就換、記下原因。
// 上一輪的方式與已接受的風險都由這裡帶給後端，後端不保存任何狀態
// 每次檢查都編號。回應回來時編號已經變了，代表使用者在等待期間又改了條件（切換情境、
// 換交通方式…），舊的回應是針對過期的條件算的，不能套用；新的檢查也不能因為舊的
// 還沒回來就被擋掉，否則使用者剛按下的情境完全沒有反應
let replanSeq = 0;

function maybeReplan() {
  renderAdjust();
  if (!autoMode || !lastData || !lastData.next_class || !lastData.origin) return;
  if (skipReplan) { skipReplan = false; return; }   // 剛換完的那次重新載入，不必馬上再檢查

  const seq = ++replanSeq;
  autoStatus = "檢查目前的交通方式中…";
  renderAdjust();
  const params = new URLSearchParams({ mode, vehicle });
  if (origin) params.set("origin", origin);
  if (simNow) params.set("now", simNow);
  if (scenarios.size) params.set("scenario", [...scenarios].join(","));
  if (knownSoft.length) params.set("known_soft", knownSoft.join(","));

  fetch(`/api/replan?${params}`)
    .then(r => r.json())
    .then(r => {
      if (seq !== replanSeq) return;
      if (!r.action) {
        autoStatus = "檢查失敗：" + (r.error || r.error_message || r.note || "原因不明");
        renderAdjust();
        return;
      }
      knownSoft = r.soft_codes || [];
      const stamp = (r.at || "").slice(11, 16);
      const options = (lastData.scenarios && lastData.scenarios.options) || {};
      const sim = (r.simulated_scenarios || []).map(k => scenarioShortName(options, k)).join("、");
      autoStatus = `${stamp} 已檢查（${r.checked === "quick" ? "只查目前這一種" : "比較了四種方式"}）：${r.summary}`;

      if (r.action === "switch" && r.mode && r.mode !== mode) {
        pushAdjust({ time: stamp, text: r.summary, kind: "switch", sim });
        mode = r.mode;
        bikePick = { from: null, to: null }; bikeJourney = null;
        skipReplan = true;
        load();
        return;
      }
      if (r.action === "no_option") pushAdjust({ time: stamp, text: r.summary, kind: "warn", sim });
      renderAdjust();
    })
    .catch(e => {
      if (seq !== replanSeq) return;
      autoStatus = "檢查失敗：" + e.message;
      renderAdjust();
    });
}

/* ---------- 遲到通知信草稿 ---------- */

function mailtoHref() {
  const addr = $("lateTo").value.split(",").map(s => s.trim()).filter(Boolean)
    .map(s => encodeURIComponent(s).replace(/%40/g, "@")).join(",");
  return `mailto:${addr}?subject=${encodeURIComponent($("lateSubject").value)}`
    + `&body=${encodeURIComponent($("lateBody").value.replace(/\n/g, "\r\n"))}`;
}

function openLateDraft(d) {
  const box = $("lateCard");
  const title = d.kind === "leave" ? "請假通知信草稿" : "遲到通知信草稿";
  box.hidden = false;
  box.innerHTML = `<p class="label">${title}</p><p class="spinner">產生中…</p>`;
  const params = new URLSearchParams({ course: d.course, starts_at: d.starts, late: d.min,
                                       place: d.place || "", kind: d.kind || "late" });
  if (d.reason) params.set("reason", d.reason);
  fetch(`/api/late_notice?${params}`)
    .then(r => r.json())
    .then(n => {
      if (n.error) {
        box.innerHTML = `<p class="label">${title}</p><p class="err">${esc(n.error)}</p>`;
        return;
      }
      // 原因與署名都要使用者自己填：草稿裡是佔位，明講要換掉，免得原樣寄出
      const todo = [n.needs_reason ? `把「${REASON_PLACEHOLDER}」換成實際原因` : "",
                    n.needs_sender ? "把署名換成你自己的" : ""].filter(Boolean).join("、");
      box.innerHTML = `<div class="draft"><p class="label">${title}</p>
        <p class="note warn">${esc(n.note)}</p>
        <label for="lateTo">收件人（老師或助教的信箱，可留空）</label>
        <input id="lateTo" type="email" autocomplete="off">
        <label for="lateSubject">主旨</label>
        <input id="lateSubject" value="${esc(n.subject)}">
        <label for="lateBody">內文${todo ? "（請" + esc(todo) + "）" : ""}</label>
        <textarea id="lateBody">${esc(n.body)}</textarea>
        <p style="margin-top:14px"><a class="btn" id="lateMailto" href="#">用郵件軟體開啟</a>
          <button type="button" class="ghost" id="lateCopy" style="margin-left:8px">複製內文</button>
          <button type="button" class="ghost" id="lateClose" style="margin-left:8px">關閉</button></p></div>`;
      $("lateMailto").href = mailtoHref();
      box.scrollIntoView({ behavior: "smooth", block: "nearest" });
    })
    .catch(e => {
      box.innerHTML = `<p class="label">${title}</p><p class="err">${esc(e.message)}</p>`;
    });
}

async function copyLateBody() {
  const body = $("lateBody");
  try { await navigator.clipboard.writeText(body.value); return true; }
  catch (e) {
    body.select();
    try { return document.execCommand("copy"); } catch (e2) { return false; }
  }
}

/* ---------- 事件 ---------- */

$("scenarioChips").addEventListener("click", e => {
  const btn = e.target.closest("[data-scenario]");
  if (!btn) return;
  const key = btn.dataset.scenario;
  if (!key) scenarios.clear();
  else if (scenarios.has(key)) scenarios.delete(key);
  else scenarios.add(key);
  knownSoft = [];
  load();
});

$("autoMode").addEventListener("change", e => {
  autoMode = e.target.checked;
  LS.set("autoMode", autoMode);
  knownSoft = [];
  autoStatus = "";
  if (autoMode) pushAdjust({ time: new Date().toTimeString().slice(0, 5),
                             text: "開始自動監控：之後每次更新都會檢查目前的交通方式還行不行。",
                             kind: "info", sim: "" });
  load();
});

$("adjust").addEventListener("click", e => {
  if (!e.target.closest("#clearAdjust")) return;
  adjustLog = [];
  LS.set("adjustLog", adjustLog);
  renderAdjust();
});

$("hero").addEventListener("click", e => {
  const late = e.target.closest("[data-late]");
  if (late) { openLateDraft(late.dataset); return; }

  const geo = e.target.closest("[data-geo]");
  if (!geo) return;
  if (geo.dataset.geo === "off") { geoPos = null; geoError = ""; load(); return; }
  if (!navigator.geolocation) {
    geoError = "這個瀏覽器不支援定位，請直接在「出發地」輸入你現在的位置。";
    renderHero(lastData);
    return;
  }
  geo.textContent = "定位中…";
  navigator.geolocation.getCurrentPosition(
    pos => {
      geoPos = { lat: pos.coords.latitude, lon: pos.coords.longitude,
                 accuracy: pos.coords.accuracy, at: new Date() };
      geoError = "";
      load();
    },
    err => {
      geoError = err.code === 1
        ? "你拒絕了定位權限，無法使用即時位置；也可以直接在「出發地」輸入你現在的位置。"
        : "無法取得位置：" + err.message;
      renderHero(lastData);
    },
    // maximumAge: 0 = 一定要重新定位。出席檢查要的是「此刻」在哪，
    // 沿用一分鐘內的快取，會讓人已經走出教室、畫面卻還說他在教室
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
});

$("lateCard").addEventListener("input", e => {
  if (["lateTo", "lateSubject", "lateBody"].includes(e.target.id)) $("lateMailto").href = mailtoHref();
});

$("lateCard").addEventListener("click", async e => {
  if (e.target.closest("#lateClose")) { $("lateCard").hidden = true; return; }
  const copy = e.target.closest("#lateCopy");
  if (!copy) return;
  copy.textContent = (await copyLateBody()) ? "已複製" : "複製失敗，請手動選取";
  setTimeout(() => { copy.textContent = "複製內文"; }, 2000);
});

$("scanCard").addEventListener("change", e => {
  if (e.target.id === "signInput") scanSign(e.target.files[0]);
});

// 點選「相近的教室」建議
$("scanCard").addEventListener("click", e => {
  const btn = e.target.closest("[data-here]");
  if (btn) confirmHere(btn.dataset.here);
});

// 手動輸入代碼
$("scanCard").addEventListener("submit", e => {
  if (e.target.id !== "hereForm") return;
  e.preventDefault();
  confirmHere($("hereInput").value);
});

$("prefForm").addEventListener("submit", e => {
  e.preventDefault();
  pref = $("prefInput").value.trim();
  LS.set("commutePref", pref);
  loadAdvice();
});

$("originForm").addEventListener("submit", e => {
  e.preventDefault();
  origin = $("originInput").value.trim();
  knownSoft = [];
  bikePick = { from: null, to: null }; bikeJourney = null;
  load();
});

$("resetOrigin").addEventListener("click", () => {
  origin = "";
  $("originInput").value = "";
  bikePick = { from: null, to: null }; bikeJourney = null;
  load();
});

$("advice").addEventListener("click", e => {
  if (e.target.closest("#askAdvice")) loadAdvice();
});

$("classroom").addEventListener("click", e => {
  const btn = e.target.closest("[data-view], [data-floor]");
  if (!btn) return;
  if (btn.dataset.view) { classroomView = btn.dataset.view; renderClassroom(); return; }

  classroomView = "plan";
  const floor = btn.dataset.floor, plan = classroomData.floor_plan || {};
  if (floor === plan.floor) { planOverride = null; renderClassroom(); return; }
  fetch(`/api/floorplan?build_id=${encodeURIComponent(classroomData.building_id)}` +
        `&floor=${encodeURIComponent(floor)}`)
    .then(r => r.json())
    .then(r => {
      // 別層沒有「這裡」的框：目標教室不在那一層，畫了就是騙人
      planOverride = { ...r, floors: plan.floors,
                       caption: `${classroomData.building_name} ${floor} 平面圖` };
      renderClassroom();
    });
});

$("modeinfo").addEventListener("click", e => {
  const btn = e.target.closest(".pickable");
  if (!btn) return;
  const role = btn.dataset.role, name = btn.dataset.station;
  // 再點一次同一站就取消選取
  bikePick[role] = bikePick[role] === name ? null : name;
  if (lastData) renderModeInfo(lastData);
  loadBikeJourney();
});

$("modes").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  if (btn.dataset.mode) { mode = btn.dataset.mode; bikePick = { from: null, to: null }; bikeJourney = null; knownSoft = []; }
  else if (btn.dataset.veh) vehicle = btn.dataset.veh;
  else return;
  load();
});

$("leadSelect").addEventListener("change", e => {
  leadMin = Number(e.target.value);
  bannerSig = "";
  renderBanner();
});

$("simTime").addEventListener("change", e => {
  simNow = e.target.value;
  load();
});

// 把時間挪到上課前 N 分鐘：多給 30 秒，確保落在提醒門檻內側
function jumpTo(minutesBefore) {
  const next = lastData && lastData.next_class;
  if (!next) return;
  const target = new Date(new Date(next.starts_at).getTime() - minutesBefore * 60000 + 30000);
  simNow = toLocalInput(target);
  $("simTime").value = simNow;
  load();
}

$("jumpLead").addEventListener("click", () => jumpTo(leadMin));
$("jump20").addEventListener("click", () => jumpTo(20));

$("demoRouteUpdate").addEventListener("click", () => {
  if (!lastData || !lastData.next_class || !lastData.departure) {
    $("demoNote").textContent = "請先載入課表，才能展示路線更新。";
    return;
  }
  const demoData = JSON.parse(JSON.stringify(lastData));
  const departure = demoData.departure;
  if (Number.isFinite(Number(departure.travel_minutes))) {
    departure.travel_minutes = Number(departure.travel_minutes) + 5;
  }
  if (departure.leave_at) {
    departure.leave_at = new Date(new Date(departure.leave_at).getTime() - 5 * 60000).toISOString();
  }
  showRouteUpdate(lastData, demoData, { demo: true });
  $("demoNote").textContent = "已顯示路線更新通知；這不會修改課表，也不會呼叫外部 API。";
});

$("backToNow").addEventListener("click", () => {
  simNow = "";
  load();
});

$("askNotify").addEventListener("click", () => {
  if (!("Notification" in window)) { alert("這個瀏覽器不支援桌面通知。"); return; }
  Notification.requestPermission().then(p => {
    $("demoNote").textContent = p === "granted"
      ? "桌面通知已開啟，提醒觸發時會同時跳出系統通知。"
      : "瀏覽器拒絕了通知權限，畫面上的提醒橫幅仍然會出現。";
  });
});

// ---- 手機推播（ntfy）與本機 Gemma 讀信：獨立於課表輪詢，按了才動 ----
$("pushPhone").addEventListener("click", async () => {
  $("demoNote").textContent = "正在算該幾點出發並推播…";
  const params = new URLSearchParams({ mode, vehicle, always: "true" });
  if (origin) params.set("origin", origin);
  try {
    const r = await fetch(`/api/notify/departure?${params}`, { method: "POST" });
    const d = await r.json();
    const label = { sent: "已推到手機", dry_run: "fixture 模式：沒有真的送，內容如下", skipped: "時間還很充裕，沒推",
                    no_class: "課表裡沒有接下來的課", error: "推播失敗" }[d.status] || d.status;
    $("demoNote").textContent = `${label}${d.error_message ? "：" + d.error_message : ""}`
      + (d.message ? `｜${d.title}：${d.message.split(String.fromCharCode(10)).join(" ")}` : "");
  } catch (e) { $("demoNote").textContent = `推播失敗：${e}`; }
});

$("mailApply").addEventListener("click", async () => {
  const subject = $("mailSubject").value, body = $("mailBody").value;
  if (!subject.trim() && !body.trim()) { $("mailResult").innerHTML = '<p class="err">先貼信件內容。</p>'; return; }
  $("mailResult").innerHTML = '<p class="spinner">本機 Gemma 讀信中（約 10 秒）…</p>';
  try {
    const r = await fetch("/api/mail/apply", { method: "POST", headers: { "Content-Type": "application/json" },
                                              body: JSON.stringify({ subject, body }) });
    const d = await r.json();
    if (d.status !== "ok") { $("mailResult").innerHTML = `<p class="err">${esc(d.note || d.error || d.status)}</p>`; return; }
    const m = d.mail, patch = d.proposed_patch || {};
    const kindLabel = { room_change: "教室異動", time_change: "時間異動", cancelled: "停課", online: "改線上",
                        exam: "考試", presentation: "報告", info: "課程資訊", irrelevant: "與課程無關" }[m.kind] || m.kind;
    const rows = Object.entries(patch).map(([k, v]) => `<div class="row"><dt>${esc(k)}</dt><dd>${esc(String(v))}</dd></div>`).join("");
    $("mailResult").innerHTML = `
      <p style="margin:12px 0 4px"><span class="badge">${esc(kindLabel)}</span>
        <span class="badge">${esc(m.importance)}</span>
        <span class="note" style="margin:0 0 0 6px">${esc(m.model)}・信心 ${m.confidence}</span></p>
      <p style="margin:6px 0">${esc(d.note)}</p>
      ${rows ? `<dl class="rows" style="margin-top:8px">${rows}</dl>` : ""}
      <p class="note">${d.change?.status === 'active' ? '已建立單次調整，正常課表保留。' : '已列入待確認，尚未影響排程。'}</p>`;
    refreshMail();
    load();
  } catch (e) { $("mailResult").innerHTML = `<p class="err">讀信失敗：${esc(String(e))}</p>`; }
});

async function refreshMail() {
  try {
    const [s, history] = await Promise.all([fetch('/api/gmail/status').then(r=>r.json()), fetch('/api/mail/changes').then(r=>r.json())]);
    const labels = {disconnected:'尚未連接', authorizing:'等待 Google 授權', connected:'已連接', syncing:'正在收信', error:'收信需要處理'};
    $('gmailStatus').textContent = `${labels[s.state] || s.state || '無法取得信箱狀態'}${s.last_sync ? ' · 上次同步 ' + s.last_sync : ''}${s.error ? ' · ' + s.error : ''}`;
    const stateNames = {active:'單次調整', review:'待確認', reverted:'已復原', superseded:'已被較新通知取代'};
    $('mailChanges').innerHTML = (history.changes || []).map(c => `<div style="border-top:1px solid #ddd;padding:12px 0">
      <b>${esc(stateNames[c.status] || c.status)} · ${esc(c.course_name || '未配對課程')}</b>
      <p>${esc(c.effective_date || '日期待確認')} ${c.patch.start_time ? `${esc(c.original.start_time)} → ${esc(c.patch.start_time)}` : ''}</p>
      <p class="note">${esc(c.reason)}<br>來源：${esc(c.subject)}</p>
      ${c.status === 'active' ? `<button class="btn" data-undo="${esc(c.id)}">復原這次調整</button>` : ''}</div>`).join('');
  } catch (_) { $('gmailStatus').textContent = '無法連接收信服務'; }
}
$('gmailConnect').addEventListener('click', async () => {
  try {
    const r = await fetch('/api/gmail/connect', {method:'POST'}); const d = await r.json();
    if (!r.ok) { $('gmailStatus').textContent = d.error; return; }
    refreshMail();
  } catch (_) { $('gmailStatus').textContent = '無法啟動授權'; }
});
$('gmailSync').addEventListener('click', async () => {
  $('gmailStatus').textContent = '正在收信…';
  try { const r = await fetch('/api/gmail/sync', {method:'POST'}); const d = await r.json();
    if (!r.ok) { $('gmailStatus').textContent = d.error; return; }
    refreshMail(); load();
  } catch (_) { $('gmailStatus').textContent = '收信失敗'; }
});
$('mailChanges').addEventListener('click', async e => {
  const button = e.target.closest('[data-undo]'); if (!button) return;
  const r = await fetch('/api/mail/undo', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:button.dataset.undo})});
  if (r.ok) { refreshMail(); load(); }
});
setInterval(refreshMail, 15000);
refreshMail();
setInterval(tick, 1000);
load();
</script>
